[project]
name = "sklearn_minisom"
version = "0.1.0"
authors = [
  { name="Jakub Kołodziej", email="jakvb.kolodziej@gmail.com" },
]
description = "MiniSom library wrapper for seamless integration with SciKit-learn library."
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

requires-python = ">=3.14"
dependencies = [
    "minisom[fast]>=2.3.6",
    "numpy>=2.4.2",
    "scikit-learn>=1.8.0",
]

[project.urls]
Homepage = "https://github.com/koloiyolo/sklearn_minisom/"
Issues = "https://github.com/koloiyolo/sklearn_minisom/issues"

[build-system]
requires = ["uv_build>=0.12.0,<0.12.6"]
build-backend = "uv_build"
