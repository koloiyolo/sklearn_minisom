repos:
  - repo: local
    hooks:
      # Run the formatter.
      - id: ruff_format
        name: ruff format
        entry: uvx ruff format
        language: system
        types: [python]

      - id: ruff_check
        name: ruff check
        entry: uvx ruff check
        language: system
        types: [python]

      - id: ty check
        name: ty check
        entry: uvx ty check
        language: system
        types: [python]
